apiVersion: v1
kind: ConfigMap
metadata:
  name: app-placeholder
data:
  index.html: |
    <!DOCTYPE html>
    <html lang="ru">
    <head><meta charset="utf-8"><title>App</title></head>
    <body><p>Замените образ app-placeholder своим сервисом.</p></body>
    </html>
  nginx.conf: |
    worker_processes 1;
    error_log /dev/stderr warn;
    pid /tmp/nginx.pid;
    events { worker_connections 64; }
    http {
      server {
        listen 8080;
        location /healthz {
          default_type text/plain;
          return 200 "ok\n";
        }
        location / {
          root /usr/share/nginx/html;
        }
      }
    }
---
apiVersion: v1
kind: Service
metadata:
  name: app
spec:
  selector:
    app: app
  ports:
    - name: http
      port: 8080
      targetPort: http
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: app
spec:
  replicas: 1
  selector:
    matchLabels:
      app: app
  template:
    metadata:
      labels:
        app: app
    spec:
      containers:
        - name: app
          image: app-placeholder
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: DATABASE_HOST
              value: postgres
            - name: DATABASE_NAME
              valueFrom:
                secretKeyRef:
                  name: db-auth
                  key: database
            - name: DATABASE_USER
              valueFrom:
                secretKeyRef:
                  name: db-auth
                  key: username
            - name: DATABASE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: db-auth
                  key: password
            - name: REDIS_HOST
              value: redis
            - name: RABBITMQ_HOST
              value: rabbitmq
          volumeMounts:
            - name: html
              mountPath: /usr/share/nginx/html
            - name: nginx
              mountPath: /etc/nginx/nginx.conf
              subPath: nginx.conf
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 5
          resources:
            requests:
              cpu: 20m
              memory: 32Mi
            limits:
              memory: 256Mi
      volumes:
        - name: html
          configMap:
            name: app-placeholder
            items:
              - key: index.html
                path: index.html
        - name: nginx
          configMap:
            name: app-placeholder
            items:
              - key: nginx.conf
                path: nginx.conf
